<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Robot Notifications</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow-x: hidden; font-family: Arial, sans-serif; color: white;
      background: radial-gradient(circle at center, #243b75, #080d20);
    }
    .container { padding: 30px 20px; text-align: center; }
    h1 { color: #63f5ff; }
    p { color: #c6d1ed; }
    .robot {
      position: relative; width: 180px; margin: 70px auto 35px;
      animation: float 3s ease-in-out infinite;
    }
    .antenna {
      position: absolute; top: -35px; left: 87px; width: 6px;
      height: 35px; background: #aab9d4;
    }
    .antenna::before {
      content: ""; position: absolute; top: -12px; left: -7px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #ff55ce; box-shadow: 0 0 25px #ff55ce;
    }
    .head {
      padding: 25px 20px; border: 4px solid #68efff; border-radius: 35px;
      background: #cbd8eb; box-shadow: 0 0 35px #26d9ff55;
    }
    .face { padding: 20px 12px; border-radius: 20px; background: #111b34; }
    .eyes { display: flex; justify-content: space-around; }
    .eye {
      width: 23px; height: 23px; border-radius: 50%; background: #63f5ff;
      box-shadow: 0 0 15px #63f5ff; animation: blink 5s infinite;
    }
    .mouth {
      width: 38px; height: 15px; margin: 15px auto 0;
      border-bottom: 4px solid #63f5ff; border-radius: 50%;
    }
    .body {
      width: 110px; height: 75px; margin: 8px auto; display: grid;
      place-items: center; border-radius: 20px 20px 35px 35px;
      background: #aab9d4; color: #17264c; font-weight: bold;
    }
    button {
      padding: 15px 25px; border: none; border-radius: 30px; color: #071225;
      background: #a6a7af; font-size: 16px; font-weight: bold; cursor: pointer;
      box-shadow: 0 0 25px #63f5ff55; transition: transform 0.2s;
    }
    button:hover { transform: translateY(-3px); }
    button:focus-visible { outline: 3px solid #8900c9; outline-offset: 5px; }
    .notification {
      position: fixed; top: 24px; right: 24px;
      width: min(350px, calc(100vw - 48px)); padding: 20px;
      border: 1px solid #63f5ff; border-radius: 18px; background: #14213d;
      box-shadow: 0 10px 40px #0008; opacity: 0; transform: translateY(-140%);
      transition: transform 0.5s ease, opacity 0.5s ease; pointer-events: none;
    }
    .notification.show { opacity: 1; transform: translateY(0); }
    .notification h2 { margin: 0 0 10px; color: #63f5ff; font-size: 18px; }
    .notification p { margin: 0; line-height: 1.5; }
    .notification small { display: block; margin-top: 12px; color: #a9badc; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }
    @keyframes blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Your AI Assistant</h1>
    <p>Your robot has a message for you.</p>
    <div class="robot" aria-hidden="true">
      <div class="antenna"></div>
      <div class="head">
        <div class="face">
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="body">AI BOT</div>
    </div>
    <button id="sendButton">✉ Send Me a Notification</button>
  </main>
  <aside class="notification" id="notification" role="status"
    aria-live="polite" aria-atomic="true"></aside>
  <script>
    const sendButton = document.getElementById("sendButton");
    const notification = document.getElementById("notification");
    let hideTimer;
    let showTimer;
    function sendNotification() {
      clearTimeout(hideTimer);
      clearTimeout(showTimer);
      notification.classList.remove("show");
      notification.replaceChildren();
      showTimer = setTimeout(() => {
        notification.innerHTML = `
          <h2>✉ New Message from AI Bot</h2>
          <p>Hey Derrick! Your next coding adventure is ready.
          Keep building and improving your skills! 🤖</p>
          <small>AI Assistant • Just now</small>
        `;
        notification.classList.add("show");
        hideTimer = setTimeout(() => {
          notification.classList.remove("show");
        }, 6000);
      }, 200);
    }
    sendButton.addEventListener("click", sendNotification);
    // Show the first notification after the page loads.
    setTimeout(sendNotification, 2000);
  </script>
</body>
</html>
